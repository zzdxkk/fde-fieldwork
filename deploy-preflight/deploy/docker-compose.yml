# 由 check_env.py 按实测环境生成；无 GPU 时为 Ollama 路线
services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports: ["11434:11434"]
    volumes: ["./models:/root/.ollama"]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
    # 本机未检测到 GPU：若客户机有 GPU，取消上面 deploy 段注释并改 image 为 vllm/vllm-openai
  app:
    build: .
    restart: always
    ports: ["8080:8080"]
    depends_on: [ollama]
    environment:
      - LLM_BASE=http://ollama:11434
      - MODEL=Qwen2.5-3B-Instruct（Q4）
      - KB_PATH=/data/kb.csv
    volumes: ["./data:/data"]
